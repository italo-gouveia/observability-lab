name: observability-lab

services:
  go-demo:
    build: ./apps/go-demo
    container_name: go-demo
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: go-demo
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=observability-lab,deployment.environment=local
      ORDERS_URL: http://java-orders:8081
    ports:
      - "8080:8080"
    depends_on:
      - otel-collector
      - java-orders

  java-orders:
    build: ./apps/java-orders
    container_name: java-orders
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: java-orders
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=observability-lab,deployment.environment=local
      OTEL_LOGS_EXPORTER: otlp
      PRICING_URL: http://python-pricing:8082
    ports:
      - "8081:8081"
    depends_on:
      - otel-collector
      - python-pricing

  python-pricing:
    build: ./apps/python-pricing
    container_name: python-pricing
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: python-pricing
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=observability-lab,deployment.environment=local
      OTEL_LOGS_EXPORTER: otlp
    ports:
      - "8082:8082"
    depends_on:
      - otel-collector

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    container_name: otel-collector
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel-collector/config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus scrape (app metrics)
    depends_on:
      - tempo
      - loki
      - jaeger

  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"

  tempo:
    image: grafana/tempo:2.6.1
    container_name: tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"

  loki:
    image: grafana/loki:3.3.2
    container_name: loki
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"

  grafana:
    image: grafana/grafana:11.4.0
    container_name: grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
      - tempo

  # --- N1: alerting & uptime ---
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    command: ["--config.file=/etc/alertmanager/config.yml"]
    volumes:
      - ./alertmanager/config.yml:/etc/alertmanager/config.yml:ro
    ports:
      - "9093:9093"
    depends_on:
      - alertsink

  alertsink:
    image: python:3.12-slim
    container_name: alertsink
    command: ["python", "/app/sink.py"]
    volumes:
      - ./apps/alertsink/sink.py:/app/sink.py:ro

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: blackbox-exporter
    command: ["--config.file=/etc/blackbox_exporter/config.yml"]
    volumes:
      - ./blackbox/config.yml:/etc/blackbox_exporter/config.yml:ro
    ports:
      - "9115:9115"

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # Jaeger UI

  # Datadog is an OPT-IN destination, not part of the default stack. It adds a
  # `datadog` exporter to this same collector (no separate agent, no app change).
  # Enable with the overlay + your key:
  #   docker compose -f docker-compose.yml -f docker-compose.datadog.yml up --build
  # See docker-compose.datadog.yml and otel-collector/config-with-datadog.yaml.

volumes:
  tempo-data:
  loki-data:
