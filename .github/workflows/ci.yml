name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: Go (build · vet · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/go-demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: apps/go-demo/go.sum
      - run: go mod download
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...

  compose:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config -q
